<!-- #region modal -->
<div class="backdrop is-open" id="modal">
  <div class="modal">
    <button class="close-button" type="button">
      <svg class="close-icon" width="32" height="32">
        <use href="../img/icons.svg#close"></use>
      </svg>
    </button>
    <h3 class="modal-title">Thank You for Your Inquiry!</h3>
    <img
      class="modal-img"
      srcset="../img/success-content-image.jpg 1x ../success-content-image@2x.jpg 2x"
      src="../img/success-content-image.jpg"
      alt="An elegant and styled flat lay composition"
      width="295"
      height="207"
    />
    <p class="modal-text">
      I have received your message and I'm so excited about your interest! I
      will get in touch with you within 24-48 hours to discuss the details of
      your wedding day. In the meantime, feel free to browse my portfolio or
      follow me on Instagram for more inspiration.
    </p>
  </div>
</div>
<!-- #endregion modal -->
