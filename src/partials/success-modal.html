<dialog
  class="success-modal"
  aria-modal="true"
  aria-labelledby="success-modal-title"
  aria-describedby="success-modal-description"
>
  <div class="success-modal__content">
    <button
      class="success-modal__close"
      type="button"
      aria-label="Close confirmation"
      autofocus
    >
      <svg width="24" height="24" aria-hidden="true" focusable="false">
        <use href="./img/icons.svg#close"></use>
      </svg>
    </button>
    <h2 class="success-modal__title" id="success-modal-title">
      Thank You for Your Inquiry!
    </h2>
    <img
      class="success-modal__image"
      src="./img/success-modal-stationery.jpg"
      srcset="
        ./img/success-modal-stationery.jpg    1x,
        ./img/success-modal-stationery@2x.jpg 2x
      "
      width="640"
      height="448"
      loading="lazy"
      alt="Wedding photographs, handwritten stationery, a fountain pen and coffee on linen"
    />
    <p class="success-modal__description" id="success-modal-description">
      I have received your message and I'm so excited about your interest! I
      will get in touch with you within 24-48 hours to discuss the details of
      your wedding day. In the meantime, feel free to browse my portfolio or
      follow me on Instagram for more inspiration.
    </p>
  </div>
</dialog>
